<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'SCA Report Studio' }}</title><style>
:root{color-scheme:dark;--bg:#08111f;--card:#101d30;--ink:#edf5ff;--muted:#9eb0c8;--accent:#3dd6b4;--line:#273952}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#08111f,#10233d);color:var(--ink);font:16px system-ui,sans-serif;min-height:100vh}header,main{max-width:1200px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(2rem,5vw,4rem);margin:.3em 0}h2{color:var(--accent)}p{color:var(--muted);line-height:1.6}.card{background:rgba(16,29,48,.94);padding:28px;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 60px #0005;margin-bottom:24px}label{display:block;margin:14px 0 6px;font-weight:700}input,button{font:inherit;border-radius:8px;padding:12px;border:1px solid var(--line)}input{width:100%;background:#07101c;color:var(--ink)}button,.button{background:var(--accent);color:#062018;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:transparent;color:var(--ink)}.flash{padding:12px;border-left:4px solid #ffcc66;background:#332814}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border:1px solid var(--line);vertical-align:top;text-align:left}th{position:sticky;top:0;background:#16314f}.scroll{overflow:auto;max-height:68vh}.actions{display:flex;gap:10px;flex-wrap:wrap}form.inline{display:inline}@media print{header,.no-print{display:none}.card{box-shadow:none;border:0}body{background:white;color:black}p{color:#333}}
</style></head><body><header><strong>✓ SCA Report Studio</strong>{% if session.user_id %}<form class="inline" method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="secondary">Log out</button></form>{% endif %}</header><main>{% for message in get_flashed_messages() %}<p class="flash">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
