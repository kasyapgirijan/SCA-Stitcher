{% extends 'base.html' %}
{% block content %}
<section class="panel auth-panel">
  <div class="auth-heading">
    <span class="brand-mark auth-mark" aria-hidden="true">Cx</span>
    <div>
      <p class="eyebrow">Account security</p>
      <h1>Change password</h1>
      {% if g.must_change_password %}
      <p>Replace the temporary password before continuing.</p>
      {% else %}
      <p>Update the password for your local account.</p>
      {% endif %}
    </div>
  </div>
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="current-password">Current password</label>
      <input id="current-password" type="password" name="current_password" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new-password">New password</label>
      <input id="new-password" type="password" name="new_password" autocomplete="new-password" minlength="12" maxlength="256" required>
      <small>Use at least 12 characters.</small>
    </div>
    <div class="field">
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" name="confirm_password" autocomplete="new-password" minlength="12" maxlength="256" required>
    </div>
    <button class="button button-primary button-full" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
