{% extends 'base.html' %}
{% block content %}
<section class="panel auth-panel">
  <div class="auth-heading">
    <span class="brand-mark auth-mark" aria-hidden="true">Cx</span>
    <div>
      <p class="eyebrow">First account</p>
      <h1>Create the admin user</h1>
      <p>This one-time setup stores only a username and a securely hashed password.</p>
    </div>
  </div>
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" minlength="3" autocomplete="username" autofocus required>
      <small>At least 3 characters</small>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" minlength="12" autocomplete="new-password" required>
      <small>At least 12 characters</small>
    </div>
    <button class="button button-primary button-full" type="submit">Create account</button>
  </form>
</section>
{% endblock %}
